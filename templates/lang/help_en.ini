[HILFE]
K01 = "Fronius Watch"
K02 = "The plugin reads the Fronius Solar API v1 of the Datamanagers entered, read-only. It reports status and error code of each inverter, the energy counters kept by the device (day, year, total) as a cross-check against the Loxone meters and – if switched on – the values of the storage modules (state of charge, cycles, cell voltage, temperature) with derived values such as the spread of the state of charge."
K03 = "Everything that does something is off by default: the service, all notifications, all thresholds and the storage modules as a send group. The plugin never writes to an inverter and does not use Modbus."
K04 = "Consideration for other readers"
K05 = "Per Datamanager never more than one request is sent at a time, with 4 s between two requests (Solar API V1, section 2.6). The default interval is 300 s. The measure button in the Test tab uses the same lock as the service. The HTTP endpoint never queries a Datamanager, it only reads the state."
K06 = "Codes and their meaning"
K07 = "Status codes according to Solar API V1 (42,0410,2012), section 4.6.5. Error codes 306 and 307 according to the Fronius operating instructions Symo/Eco (class 3 status codes) and Energy Package (Symo Hybrid): both appear routinely in the morning and evening and are not a fault. Other error codes are shown as a number only; their meaning is in the documentation of the device. The cell state of the modules follows section 4.9.7 (one byte 0xYX, Y current, X previous)."
K08 = "What has not been measured"
K09 = "The night operation has been measured (12.11.2026). During the day, module values while charging and discharging, the reading of the cell state while discharging, P_Akku with a full idle storage and the error code over a day have not been measured yet. A threshold is a setting, not a manufacturer value."
