[EINST]
WAS_IST_DAS = "Fronius Watch reads the Fronius Solar API of the Datamanagers entered here, read-only: status and error code per inverter, the energy counters kept by the device and – if switched on – the values of the storage modules. It never writes to an inverter and does not use Modbus."
H_DIENST = "Service"
L_DIENST = "Switch on the service (off by default)"
H_DIENST_HILFE = "Without this tick the plugin does not query any Datamanager. The LoxBerry minute cron calls the service every minute; a query happens only when the configured interval has elapsed."
L_TAKT = "Interval in seconds"
H_TAKT = "Default %d s, allowed %d to %d. Status, error code, energy counters and module values do not change within seconds; a coarse interval keeps the load low on a Datamanager that other plugins (for example Feed-in Brake) query far more often."
L_TIMEOUT = "Timeout per request in seconds"
H_TIMEOUT = "Default %d s. Between two requests to the same Datamanager there is a pause of %d s (Solar API V1, section 2.6); never more than one request is sent at a time."
H_DM = "Datamanagers"
H_DM_HILFE = "Address without http:// and without a path, optionally with :port. Each Solar API sees only its own inverters; with two Datamanagers enter both. The plugin reads from the response which devices are behind it."
L_DM = "Datamanager %d"
H_GRUPPEN = "Send groups"
L_GRUPPE_WR = "Status and error code of the inverters"
H_GRUPPE_WR = "One request per run (GetInverterInfo)."
L_GRUPPE_ENERGIE = "Energy counters day, year, total (cross-check against Loxone)"
H_GRUPPE_ENERGIE = "One request per run (GetInverterRealtimeData, scope System). Unit Wh, as the device counts."
L_GRUPPE_SPEICHER = "Storage modules: state of charge, cycles, cell voltage per module, spread (off by default)"
H_GRUPPE_SPEICHER = "One more request per run (GetStorageRealtimeData), only to Datamanagers with a storage. About 100 additional values with eight modules."
H_MELDUNGEN = "Notifications and thresholds"
H_MELDUNGEN_HILFE = "Notifications are sent as LoxBerry notifications, only when the state changes, never in the first run. All are off by default."
L_MELD_STOERUNG = "Notify on an inverter fault"
H_MELD_STOERUNG = "Fault means: status code 10 (Error) or an error code that the Fronius documentation does not list as routine. 306 and 307 appear routinely in the morning and evening and do not count as a fault."
L_MELD_AUSFALL = "Notify when a Datamanager does not answer"
H_MELD_AUSFALL = "Notified after %d runs in a row without a complete answer, and once when it answers again."
L_MELD_SPEICHER = "Notify when a storage threshold is exceeded"
H_MELD_SPEICHER = "Only works with a threshold above 0."
L_SCHWELLE_STREUUNG = "Threshold spread of state of charge in percentage points (0 = off)"
H_SCHWELLE_STREUUNG = "A setting, not a manufacturer value. 0 by default. Measured on 12.11.2026 at night with an idle storage: 25 percentage points – whether that is normal has not been measured."
L_SCHWELLE_ZELLEN = "Threshold largest cell voltage difference in mV (0 = off)"
H_SCHWELLE_ZELLEN = "A setting, not a manufacturer value. 0 by default. Measured on 12.11.2026 at night: 51 mV across all modules."
H_EB = "Feed-in Brake (display only)"
L_EB = "Show the state of Feed-in Brake in the Test tab (off by default)"
H_EB_HILFE = "Reads on this LoxBerry only control on/off, interval and age of its last run from its files. Does not query any Datamanager additionally and changes nothing in Feed-in Brake."
L_STAND_RETTEN = "Keep the polling state across an update (off by default)"
H_STAND_RETTEN = "Without this tick the state starts afresh after every update: the first run afterwards reports nothing, and a fault that begins during the update is not reported while it lasts. With the tick the update puts the state (stand.json, no credentials) next to the data folder and restores it afterwards."
L_JSON = "Allow the compact query as JSON (aktion=json, off by default)"
H_JSON = "For an overview such as the Dashboard: per Datamanager state and age, per inverter status, error code and fault, per storage state of charge, number of modules, spread of the state of charge and largest cell voltage difference. Reads only the state of the service and is open like the query per Datamanager (no token); no address, no token, no serial number."
H_ANSAGE = "Voice announcements"
ANSAGE_ERKLAERUNG = "The plugin can announce a fault of an inverter and exceeding the threshold for the cell voltage difference over the speakers of the house – with the same shared speech module as the other plugins. Each onset is announced once, the end is not. Night silence, lock and the switch ‘announcements off’ (haus/ansage/ruhe) apply as everywhere. Both occasions are off by default."
ANSAGE_ANLAESSE = "Occasions"
L_ANSAGE_STOERUNG = "Announce a fault of an inverter (off by default)"
L_ANSAGE_ZELLEN = "Announce exceeding the threshold for the cell voltage difference (off by default)"
ANSAGE_ANLAESSE_HILFE = "A fault means the same as for the notification: status code 10 (Error) or an error code that according to the Fronius documentation is not a routine message. The cell voltage announcement only works with a threshold above 0. Announcements follow only a complete query."
K_ANSAGE_SPEICHERN = "Save voice announcements"
