[EINST]
WAS_IST_DAS = "Fronius Watch reads the Fronius Solar API of the Datamanagers entered here, read-only: status and error code per inverter, the energy counters kept by the device and – if switched on – the values of the storage modules. It never writes to an inverter and does not use Modbus."
