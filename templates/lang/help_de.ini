[HILFE]
K01 = "Fronius-Wächter"
K02 = "Das Plugin liest die Fronius Solar API v1 der eingetragenen Datamanager, nur lesend. Es meldet Status- und Fehlercode jedes Wechselrichters, die vom Gerät gezählten Energiestände (Tag, Jahr, gesamt) als Gegenprobe zu den Loxone-Zählern und – wenn eingeschaltet – die Werte der Speichermodule (Ladestand, Zyklen, Zellspannung, Temperatur) mit abgeleiteten Größen wie der Streuung des Ladestands."
K03 = "Ab Werk ist alles aus, was etwas tut: der Dienst, alle Meldungen, alle Schwellen und die Speichermodule als Sendegruppe. Das Plugin schreibt nie in einen Wechselrichter und benutzt kein Modbus."
K04 = "Rücksicht auf andere Leser"
K05 = "Je Datamanager geht nie mehr als eine Anfrage zugleich hinaus, zwischen zwei Anfragen liegen 4 s (Solar API V1, Abschnitt 2.6). Der Takt ist ab Werk 300 s. Der Messknopf im Reiter Test benutzt dieselbe Sperre wie der Dienst. Der HTTP-Endpunkt fragt nie einen Datamanager, er liest nur den Stand."
K06 = "Codes und ihre Bedeutung"
K07 = "Statuscodes nach Solar API V1 (42,0410,2012), Abschnitt 4.6.5. Fehlercodes 306 und 307 nach den Fronius-Bedienungsanleitungen Symo/Eco (Class 3 status codes) und Energy Package (Symo Hybrid): beide erscheinen morgens und abends regelmäßig und sind keine Störung. Andere Fehlercodes zeigt das Plugin nur als Zahl; die Bedeutung steht in der Unterlage des Geräts. Der Zellzustand der Module folgt Abschnitt 4.9.7 (ein Byte 0xYX, Y aktuell, X vorher)."
K08 = "Was nicht gemessen ist"
K09 = "Gemessen ist der Nachtbetrieb (12.11.2026). Tagsüber sind Modulwerte beim Laden und Entladen, die Lesart des Zellzustands beim Entladen, P_Akku bei vollem ruhendem Speicher und der Fehlercode über einen Tag noch nicht gemessen. Eine Schwelle ist eine Einstellung, keine Herstellerangabe."
