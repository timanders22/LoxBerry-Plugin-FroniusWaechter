SONOX_RAUM_HINWEIS="Der Raumname wie in der Sonos-App (Groß/klein egal, Umlaute erlaubt). Ohne Raum wird nichts gesendet."
L_SONOX_LAUT="Lautstärke der Ansage (1–100)"
SONOX_LAUT_HINWEIS="Leer: 40 (Vorgabe von SonoX)."
L_SONOX_SPRACHE="Sprache der Ansage"
SONOX_SPRACHE_HINWEIS="Zwei Buchstaben, wahlweise mit Land, z. B. de oder de-at. Pflicht: ohne Sprache spricht SonoX Englisch."
M_SONOX_RAUM="Sonos-Raum abgewiesen: höchstens 200 Zeichen, ohne Steuerzeichen und ohne Leerraum am Rand."
M_SONOX_LAUT="Lautstärke für SonoX abgewiesen: leer oder 1 bis 100."
M_SONOX_SPRACHE="Sprache für SonoX abgewiesen: zwei kleine Buchstaben, wahlweise mit Land, z. B. de oder de-at."
M_SONOX_OHNE_RAUM="Für die Ausgabeart SonoX fehlt der Raum – ohne Raum wird nichts gesendet."
T_SONOX_OK="SonoX antwortet unter %s; der Raum ist bekannt (%s Räume)."
T_SONOX_ZU="SonoX wird nur bei geöffnetem Reiter Test gefragt."
