K_SONOX_UNERWARTET="SonoX antwortete mit HTTP %s, aber ohne Erfolgsmeldung."
K_SONOX_ZEIT_UNKLAR="SonoX (%s) hat binnen %s s nicht geantwortet. Es antwortet erst nach dem Ende der Wiedergabe – ob gesprochen wurde, ist unklar."
