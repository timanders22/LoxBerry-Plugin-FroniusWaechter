L_ZIELE="Weitere Ausgabeziele (gleichzeitig)"
ZIELE_HINWEIS="Tabelle: bis zu %s Ziele insgesamt. Jede Ansage geht gleichzeitig an Ziel 1 und an jedes eingeschaltete Ziel dieser Tabelle; scheitert ein Ziel, sprechen die anderen trotzdem. Ist Ziel 1 aus, spricht keines. Neues Ziel: die leere Zeile ausfüllen und speichern."
L_ZIEL_NR="Nr."
L_ZIEL_EIN="Ein"
L_ZIEL_ART="Ausgabegerät (Plugin)"
L_ZIEL_WO="Zonen / Gerät / Raum"
L_ZIEL_LAUT="Lautstärke"
L_ZIEL_SPRACHE="Sprache"
L_ZIEL_LOESCHEN="Entfernen"
ZIEL_LEER="– kein Ziel –"
ZIEL_NEU="neu"
ZIEL_WO_HINWEIS="Zonen / Gerät / Raum je nach Ausgabegerät: Music Server und Adressvorlage Zonennummern wie 1,3 (mehrere Zonen desselben Servers gehören in EIN Ziel); Amazon Echo und Google-Lautsprecher der Gerätename wie im jeweiligen Plugin, eine Liste mit Komma oder gruppe:<Name>, leer = Standardgerät; Sonos (Sonos4Lox) die Zone wie dort (klein, ae/oe/ue/ss); Sonos (SonoX) der Sonos-Raum (SonoX schickt den Text ab Werk an Google). Lautstärke leer = die Vorgabe des Geräts bzw. von Ziel 1. Das Sprechtoken für Amazon Echo bzw. Google-Lautsprecher steht einmal oben und gilt für alle Ziele dieser Art."
L_TEST_ZIEL="Testansage an Ziel %s (%s)"
M_ZIELE="Tabelle der weiteren Ziele abgewiesen: keine Tabelle."
M_ZIEL_ART="Ziel %s: Ausgabegerät abgewiesen - bitte eines aus der Liste wählen."
M_ZIEL_WO="Ziel %s: Zonen / Gerät / Raum abgewiesen - höchstens 200 Zeichen ohne Steuerzeichen; beim Music Server und der Adressvorlage Zonennummern wie 1,3."
M_ZIEL_OHNE_WO="Ziel %s: bei Sonos bitte die Zone bzw. den Raum eintragen."
M_ZIEL_LAUT="Ziel %s: Lautstärke abgewiesen - leer oder 1 bis 100."
M_ZIEL_SPRACHE="Ziel %s: Sprache abgewiesen – zulässig sind zwei Kleinbuchstaben nach ISO 639-1, z. B. de, en, fr, it, es, nl; bei Sonos (SonoX) auch mit Land, z. B. de-at, en-gb. Leer = wie Ziel 1."
M_ZIEL_OHNE_TOKEN="Ziel %s: für dieses Ausgabegerät ist kein Sprechtoken gespeichert - bitte oben eintragen."
M_ZIEL_DOPPELT="Ziel %s: dasselbe Gerät mit demselben Ort steht schon als anderes Ziel da - die Ansage käme zweimal."
M_ZIEL1_AUS="Ziel 1 ist aus, weitere Ziele sind eingeschaltet: es spräche keines. Bitte Ziel 1 einstellen oder die weiteren Ziele ausschalten."
M_ZIEL1_AUDIOSERVER="Ziel 1 ist der Original-Audioserver (spricht über Loxone Config); weitere Ziele gehen damit nicht zusammen. Bitte ein anderes Ziel 1 wählen oder die weiteren Ziele ausschalten."
K_TTS_ZIELE="Liste der weiteren Ziele unlesbar"
