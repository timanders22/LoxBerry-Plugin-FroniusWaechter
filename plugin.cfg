[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert
# werden. Deshalb steht hier ein Projektname und eine noreply-Adresse und
# keine Person.
NAME=Fronius-Waechter Plugin Authors
EMAIL=froniuswaechter@users.noreply.github.com

[PLUGIN]
VERSION=0.9.2
NAME=froniuswaechter
FOLDER=froniuswaechter
TITLE=Fronius-Wächter

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository
# timanders22/LoxBerry-Plugin-FroniusWaechter, Zweig main; angelegt am 12.11.2026).
# Erste Fassung 0.9.1: release.cfg und prerelease.cfg nennen 0.9.1 schon im ersten
# Commit, weil es keine aeltere Nummer gibt; bis der Tag v0.9.1 steht, antwortet
# die Archivadresse mit 404.
# Bei einem Release: VERSION hier und in release.cfg/prerelease.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-FroniusWaechter/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-FroniusWaechter/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Reines PHP ab 7.4 (LoxBerry 3.0 bis 4.0 fahren 7.4), keine Pakete.
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
